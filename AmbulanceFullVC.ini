[Settings]
; Quantidade de pessoas na ambulancia (incluindo o motorista) para mostrar "Ambulance full!!"
; 0 = automatico: quando todos os assentos da ambulancia estiverem ocupados
PeopleToShowWarning=0
; 1 = gera AmbulanceFullVC.log (na pasta do .asi) para diagnostico; 0 = desliga
Log=0
; 1 = ativa o mod normalmente; 0 = so carrega o .asi sem alterar o jogo (apenas para teste)
Hook=1
